name: Test Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: |
          uv sync --frozen --group docs --group dev --extra cpu

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Build documentation
        run: |
          uv run mkdocs build --strict

      - name: Check generated documentation in Chromium
        env:
          CITY2GRAPH_DOCS_SITE: site
        run: uv run pytest -q tests/test_docs.py tests/test_docs_browser.py
